<!doctype html>
<html lang='ru'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Менеджер задач</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="./js/main.js"></script>
</head>
<body>
<main class="container py-5" style="max-width: 720px;">
<h1 class="h3 mb-4">Менеджер задач</h1>

    <form id='task-form' class="card card-body shadow-sm mb-3" novalidate>
        <div class="mb-3">
            <label for='task-title' class="form-label">Новая задача</label>
            <input id='task-title' name='title' type='text' class="form-control"
                   placeholder="Например, купить молоко"
                   aria-describedby='title-error'>
            <p id='title-error' class='field-error text-danger small mt-1 mb-0'
               aria-live='polite'></p>
        </div>
        <button type='submit' class="btn btn-primary">Добавить</button>
    </form>

    <div class="d-flex align-items-center gap-2 mb-3">
        <label for='task-filter' class="form-label mb-0">Показать</label>
        <select id='task-filter' class="form-select w-auto">
            <option value='all'>Все задачи</option>
            <option value='active'>Активные</option>
            <option value='completed'>Выполненные</option>
        </select>
        <span id='task-count' class="badge text-bg-secondary ms-auto">Всего задач: 0</span>
    </div>

    <ul id='task-list' class="list-group shadow-sm"></ul>
</main>
</body>
</html>
